backend:
  name: git-gateway        # 使用 Git 作为后端存储
  branch: main             # 内容保存到哪个分支

# 本地开发模式（可选，方便本地测试）
local_backend: true

# 发布流程：editorial_workflow 表示用 PR 方式审核
publish_mode: editorial_workflow

# 媒体文件上传目录
media_folder: "static/assets"      # 文件实际存放路径
public_folder: "/assets"           # 前端引用路径

# 内容集合定义（类似数据库表结构）
collections:
  - name: "blog"
    label: "博客文章"
    folder: "content/blog"         # 文章存放目录
    create: true                    # 允许创建新文章
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    files:
      - file: "content/about.md"
        label: "关于页面"
        name: "about"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "内容", name: "body", widget: "markdown" }
